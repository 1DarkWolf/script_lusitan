<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centro de Jogos</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: transparent !important; background-color: transparent !important; color-scheme: normal !important; }
      body { display: none !important; }
      body.cj-visible { display: block !important; }
    </style>
  </head>
  <body>
    <main id="dashboard" class="hidden">
      <section class="dashboard-shell">
        <button id="dashboard-close" type="button" aria-label="Fechar">×</button>
        <p class="eyebrow">CENTRO DE JOGOS</p>
        <h1>Painel de apostas</h1>
        <nav class="tabs">
          <button data-tab="buy" class="active">Comprar</button>
          <button data-tab="tickets">Bilhetes</button>
          <button data-tab="results">Resultados</button>
          <button data-tab="profile">Perfil</button>
          <button data-tab="ranking">Ranking</button>
          <button data-tab="company">Empresa</button>
        </nav>
        <div id="dashboard-content"></div>
      </section>
    </main>
    <main id="owner-dashboard" class="hidden">
      <section class="owner-shell">
        <button id="owner-close" type="button" aria-label="Fechar">×</button>
        <div class="owner-heading">
          <div>
            <p class="eyebrow">CENTRO DE JOGOS</p>
            <h1>Central de gestão</h1>
          </div>
          <button id="owner-refresh" class="game-button" type="button">Atualizar</button>
        </div>
        <div id="owner-content"></div>
      </section>
    </main>
    <main id="ticket-card" class="hidden">
      <section class="ticket-shell" aria-label="Bilhete de lotaria">
        <button id="ticket-close" type="button" aria-label="Fechar">×</button>
        <p class="eyebrow">CENTRO DE JOGOS</p>
        <h1 id="ticket-title">Bilhete</h1>
        <p id="ticket-id" class="ticket-id"></p>
        <div id="ticket-details" class="ticket-details"></div>
        <p class="ticket-note">Confirma os resultados na aplicação de telefone e apresenta o bilhete no balcão para levantar o prémio.</p>
      </section>
    </main>
    <main id="scratch-app" class="hidden">
      <section class="scratch-card" aria-label="Raspadinha">
        <button id="close" type="button" aria-label="Fechar">×</button>
        <div id="scratch-ticket" class="scratch-ticket" data-card="bronze">
          <img id="scratch-ticket-image" src="img/scratch_bronze.png" alt="Raspadinha Bronze">
          <div id="scratch-area" class="scratch-area" aria-label="Área para raspar">
            <div id="prize" class="prize">?</div>
            <canvas id="scratch-canvas"></canvas>
          </div>
        </div>
        <p id="status" class="scratch-status">Mantém premido e raspa a zona prateada.</p>
        <button id="finish" class="hidden" type="button">Concluir</button>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
